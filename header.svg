<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="100%" fill="none">
  <defs>
    <!-- Orange Glow Filter -->
    <filter id="orangeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Space Grotesk', Inter, sans-serif;
      font-weight: 800;
      letter-spacing: -2px;
    }
    .mono {
      font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, Monaco, monospace;
    }
  </style>

  <!-- Ambient Minimal Orange Backlight -->
  <circle cx="180" cy="55" r="45" fill="#c9654a" fill-opacity="0.1" filter="url(#orangeGlow)" />

  <!-- Main Lowercase Title: innocous. -->
  <text x="32" y="66" class="title" font-size="52" fill="#ffffff">innocous<tspan fill="#c9654a" filter="url(#orangeGlow)">.</tspan></text>

  <!-- Clean Subtitle in White / Muted White -->
  <text x="34" y="96" class="mono" font-size="12" fill="#8b8b96" letter-spacing="1">
    systems architecture <tspan fill="#c9654a">·</tspan> encrypted protocols <tspan fill="#c9654a">·</tspan> database systems
  </text>

  <!-- Minimal Circuit Trace on Right -->
  <g transform="translate(620, 50)">
    <line x1="0" y1="0" x2="160" y2="0" stroke="#c9654a" stroke-width="1.2" />
    <circle cx="160" cy="0" r="3" fill="#c9654a" />
    <circle cx="160" cy="0" r="1.2" fill="#ffffff" />
    <path d="M 160 0 L 190 0 L 210 20 L 250 20" stroke="#c9654a" stroke-width="1.2" fill="none" stroke-opacity="0.6" />
    <circle cx="250" cy="20" r="2.5" fill="#c9654a" fill-opacity="0.8" />
  </g>

  <!-- Subtle Bottom Hairline Divider -->
  <line x1="32" y1="118" x2="868" y2="118" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
  <line x1="32" y1="118" x2="140" y2="118" stroke="#c9654a" stroke-width="1.5" />
</svg>
