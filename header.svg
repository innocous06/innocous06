<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="200" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0d" />
      <stop offset="50%" stop-color="#0e0e14" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9654a" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#c9654a" stop-opacity="0.2" />
    </linearGradient>

    <!-- Text Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f2f2f5" />
      <stop offset="45%" stop-color="#ffffff" />
      <stop offset="80%" stop-color="#da8268" />
      <stop offset="100%" stop-color="#c9654a" />
    </linearGradient>

    <!-- Subtitle Gradient -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a8a98" />
      <stop offset="100%" stop-color="#b0b0bc" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.65" fill="#ffffff" fill-opacity="0.04" />
    </pattern>
  </defs>

  <style>
    .terminal-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      font-weight: 700;
      letter-spacing: -1.5px;
    }
    .mono-text {
      font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.85; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .pulse-glow {
      animation: pulse 4s ease-in-out infinite;
    }
    .blinking-cursor {
      animation: blink 1s infinite;
    }
  </style>

  <!-- Ambient Glow Behind Card -->
  <ellipse cx="220" cy="100" rx="180" ry="60" fill="#c9654a" fill-opacity="0.12" filter="url(#glow)" class="pulse-glow" />

  <!-- Main Container -->
  <rect x="1" y="1" width="848" height="198" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.2" />

  <!-- Grid Overlay -->
  <rect x="1" y="1" width="848" height="198" rx="14" fill="url(#grid)" />

  <!-- Top Terminal Header Bar -->
  <line x1="1" y1="38" x2="849" y2="38" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
  
  <!-- Terminal Dots -->
  <circle cx="28" cy="20" r="4.5" fill="#ff5f56" fill-opacity="0.85" />
  <circle cx="44" cy="20" r="4.5" fill="#ffbd2e" fill-opacity="0.85" />
  <circle cx="60" cy="20" r="4.5" fill="#27c93f" fill-opacity="0.85" />

  <!-- Terminal Path Header -->
  <text x="82" y="24" class="mono-text" font-size="11" fill="#717180" letter-spacing="0.5">
    <tspan fill="#c9654a">~</tspan>/innocous06
  </text>

  <!-- Status Pill -->
  <g transform="translate(712, 11)">
    <rect width="112" height="18" rx="9" fill="#14141c" stroke="#c9654a" stroke-opacity="0.3" stroke-width="0.8" />
    <circle cx="12" cy="9" r="3" fill="#27c93f" />
    <text x="22" y="12.5" class="mono-text" font-size="9" fill="#b0b0bc" letter-spacing="0.5">sys.online</text>
  </g>

  <!-- Main Title: innocous -->
  <g transform="translate(34, 112)">
    <!-- Terminal Prompt prefix -->
    <text x="0" y="0" class="mono-text" font-size="32" font-weight="600" fill="#c9654a" filter="url(#softGlow)">></text>
    
    <!-- Main text 'innocous' -->
    <text x="32" y="0" class="terminal-title" font-size="52" fill="url(#accentGrad)">innocous</text>

    <!-- Blinking Cursor -->
    <rect x="256" y="-36" width="10" height="42" fill="#c9654a" rx="2" class="blinking-cursor" />
  </g>

  <!-- Subtitle / Tagline -->
  <text x="68" y="148" class="mono-text" font-size="12.5" fill="url(#subGrad)" letter-spacing="0.4">
    database architecture <tspan fill="#c9654a" font-weight="600">·</tspan> encrypted vpn protocols <tspan fill="#c9654a" font-weight="600">·</tspan> cloud automation
  </text>

  <!-- Bottom Accent Strip -->
  <rect x="34" y="172" width="140" height="2" rx="1" fill="#c9654a" fill-opacity="0.7" />
  <rect x="180" y="172" width="28" height="2" rx="1" fill="#c9654a" fill-opacity="0.3" />
  <rect x="214" y="172" width="10" height="2" rx="1" fill="#c9654a" fill-opacity="0.15" />
</svg>
