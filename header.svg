<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="100%" fill="none">
  <defs>
    <!-- Sharp Terracotta Glow Filter -->
    <filter id="orangeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Space Grotesk', Inter, sans-serif;
      font-weight: 800;
      letter-spacing: -2px;
    }
    .mono {
      font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, Monaco, monospace;
    }
  </style>

  <!-- Main Lowercase Title: innocous. -->
  <g transform="translate(32, 66)">
    <text x="0" y="0" class="title" font-size="52" fill="#ffffff">innocous</text>
    
    <!-- Terracotta Dot with Blinking Animation -->
    <text x="212" y="0" class="title" font-size="52" fill="#c9654a" filter="url(#orangeGlow)">.
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.2s" repeatCount="indefinite" />
    </text>
  </g>

  <!-- Clean Subtitle in White / Muted White -->
  <text x="34" y="96" class="mono" font-size="12" fill="#8b8b96" letter-spacing="1">
    systems architecture <tspan fill="#c9654a">·</tspan> encrypted protocols <tspan fill="#c9654a">·</tspan> database systems
  </text>

  <!-- Minimal Circuit Trace on Right with Clean Moving Dot (No Trail) -->
  <g transform="translate(580, 52)">
    <!-- Base Circuit Line -->
    <path d="M 0,0 L 210,0 L 235,24 L 285,24" stroke="#c9654a" stroke-width="1.4" fill="none" stroke-opacity="0.6" />
    
    <!-- Static Circuit Terminating Pads -->
    <circle cx="0" cy="0" r="2.5" fill="#c9654a" />
    <circle cx="210" cy="0" r="2.5" fill="#c9654a" />
    <circle cx="285" cy="24" r="3" fill="#c9654a" />
    
    <!-- Clean Moving White Dot (Travels left to right along the line and loops) -->
    <circle r="2.2" fill="#ffffff">
      <animateMotion path="M 0,0 L 210,0 L 235,24 L 285,24" dur="2.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.04;0.92;0.98;1" dur="2.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Subtle Bottom Hairline Divider -->
  <line x1="32" y1="118" x2="868" y2="118" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
  <line x1="32" y1="118" x2="140" y2="118" stroke="#c9654a" stroke-width="1.5" />
</svg>
