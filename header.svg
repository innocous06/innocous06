<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="100%" fill="none">
  <defs>
    <!-- Background Gradient that seamlessly blends with GitHub dark -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12131a" />
      <stop offset="60%" stop-color="#0e0f14" />
      <stop offset="100%" stop-color="#0a0a0d" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9654a" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="70%" stop-color="#c9654a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <!-- Text Accent Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f5f5f7" />
      <stop offset="80%" stop-color="#e0866e" />
      <stop offset="100%" stop-color="#c9654a" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Dot Grid -->
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.75" fill="#ffffff" fill-opacity="0.05" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;
      font-weight: 700;
      letter-spacing: -2px;
    }
    .mono {
      font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, Monaco, monospace;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.7; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .pulsing {
      animation: pulse 3.5s ease-in-out infinite;
    }
    .cursor {
      animation: blink 1.1s infinite;
    }
  </style>

  <!-- Background Ambient Glow -->
  <ellipse cx="200" cy="85" rx="160" ry="50" fill="#c9654a" fill-opacity="0.16" filter="url(#glow)" class="pulsing" />
  <ellipse cx="750" cy="85" rx="100" ry="40" fill="#c9654a" fill-opacity="0.08" filter="url(#glow)" class="pulsing" />

  <!-- Main Card Container -->
  <rect x="1" y="1" width="898" height="168" rx="12" fill="url(#cardBg)" stroke="url(#borderGrad)" stroke-width="1.2" />

  <!-- Dot Grid Pattern Fill -->
  <rect x="1" y="1" width="898" height="168" rx="12" fill="url(#dotGrid)" />

  <!-- Terminal Top Bar Line -->
  <line x1="1" y1="36" x2="899" y2="36" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1" />

  <!-- Terminal Window Controls (Monochrome Accent) -->
  <circle cx="26" cy="18" r="4.5" fill="#c9654a" fill-opacity="0.9" />
  <circle cx="42" cy="18" r="4.5" fill="#ffffff" fill-opacity="0.25" />
  <circle cx="58" cy="18" r="4.5" fill="#ffffff" fill-opacity="0.12" />

  <!-- Breadcrumb Path -->
  <text x="80" y="22" class="mono" font-size="11.5" fill="#8b8b98" letter-spacing="0.5">
    <tspan fill="#c9654a">~/</tspan>innocous06
  </text>

  <!-- Live Status Badge -->
  <g transform="translate(768, 10)">
    <rect width="108" height="18" rx="9" fill="#181824" stroke="#c9654a" stroke-opacity="0.35" stroke-width="0.8" />
    <circle cx="11" cy="9" r="3" fill="#27c93f" />
    <text x="21" y="12.5" class="mono" font-size="9.5" fill="#c0c0cc" letter-spacing="0.5">sys.online</text>
  </g>

  <!-- Main Title: > innocous -->
  <g transform="translate(32, 98)">
    <!-- Terminal Prompt Icon -->
    <text x="0" y="0" class="mono" font-size="34" font-weight="600" fill="#c9654a">></text>
    
    <!-- Lowercase innocous text -->
    <text x="32" y="0" class="title" font-size="52" fill="url(#textGrad)">innocous</text>

    <!-- Blinking Terminal Cursor -->
    <rect x="254" y="-36" width="10" height="40" fill="#c9654a" rx="2" class="cursor" />
  </g>

  <!-- Subtitle / Focus Areas -->
  <text x="64" y="134" class="mono" font-size="13" fill="#9e9ea8" letter-spacing="0.3">
    database architecture <tspan fill="#c9654a">·</tspan> encrypted vpn protocols <tspan fill="#c9654a">·</tspan> cloud automation
  </text>

  <!-- Minimal Decorative Status Markers -->
  <g transform="translate(32, 150)">
    <rect x="0" y="0" width="120" height="2" rx="1" fill="#c9654a" fill-opacity="0.8" />
    <rect x="126" y="0" width="24" height="2" rx="1" fill="#c9654a" fill-opacity="0.35" />
    <rect x="154" y="0" width="8" height="2" rx="1" fill="#c9654a" fill-opacity="0.15" />
  </g>
</svg>
